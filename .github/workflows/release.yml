name: release

# Builds the icon and cursor packs for every v* tag and publishes the tarball.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-cairo gir1.2-rsvg-2.0 librsvg2-bin python3-numpy

      - name: Contrast gate
        run: python3 tools/dev/check_contrast.py

      - name: Build icon suites
        run: python3 tools/icons/generate_icons.py --variant both

      - name: Icon lookup gate
        run: python3 tools/dev/check_icon_contexts.py

      - name: Build cursors
        run: python3 tools/icons/generate_cursors.py

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sh tools/icons/package.sh "${VERSION}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.xz
          generate_release_notes: true
