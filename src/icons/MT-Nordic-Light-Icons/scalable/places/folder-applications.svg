<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- Back body gradient -->
  <linearGradient id="backGrad" x1="32" y1="10" x2="32" y2="54" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#E3EAF3"/>
    <stop offset="100%" stop-color="#C6D2E1"/>
  </linearGradient>
  <!-- Arctic Snow Paper insert gradient -->
  <linearGradient id="paperGrad" x1="32" y1="12" x2="32" y2="28" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="100%" stop-color="#F1F5FA"/>
  </linearGradient>
  <!-- Front flap rich Nordic Glacier gradient -->
  <linearGradient id="flapGrad" x1="32" y1="20" x2="32" y2="58" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#FDFEFF"/>
    <stop offset="35%" stop-color="#F3F7FC"/>
    <stop offset="100%" stop-color="#E1E9F2"/>
  </linearGradient>
  <!-- Specular top edge highlight -->
  <linearGradient id="specularGrad" x1="8" y1="22" x2="56" y2="22" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#4C719C" stop-opacity="0.95"/>
    <stop offset="50%" stop-color="#0079A8" stop-opacity="0.75"/>
    <stop offset="100%" stop-color="#5E81AC" stop-opacity="0.30"/>
  </linearGradient>
  <!-- Flap drop shadow filter -->
  <filter id="flapShadow" x="0" y="18" width="64" height="44" filterUnits="userSpaceOnUse">
    <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#7E8FA6" flood-opacity="0.3"/>
  </filter>
</defs>
<!-- Back folder tab & body -->
<path d="M 6 15 C 6 12.5 8 10.5 10.5 10.5 L 25 10.5 C 27.5 10.5 29.5 12 31 14 L 33 17 L 53.5 17 C 56 17 58 19 58 21.5 L 58 51.5 C 58 54 56 56 53.5 56 L 10.5 56 C 8 56 6 54 6 51.5 Z" fill="url(#backGrad)" stroke="#9EAEC3" stroke-width="1"/>
<!-- Crisp Arctic Snow Paper insert peeking out -->
<rect x="12" y="14" width="40" height="14" rx="2" fill="url(#paperGrad)" stroke="#8C9CB3" stroke-width="0.8"/>
<line x1="16" y1="18" x2="32" y2="18" stroke="#5E81AC" stroke-width="1.2" stroke-linecap="round"/>
<line x1="16" y1="21.5" x2="26" y2="21.5" stroke="#4C719C" stroke-width="1.2" stroke-linecap="round"/>
<!-- Front folder flap with shadow and curved geometry -->
<g filter="url(#flapShadow)">
  <path d="M 6 25 C 6 22.5 8 20.5 10.5 20.5 L 24 20.5 C 26.5 20.5 28.5 22 30 24 L 32.5 27 C 34 28.5 36 29.5 38.5 29.5 L 53.5 29.5 C 56 29.5 58 31.5 58 34 L 58 51.5 C 58 54.5 55.5 57 52.5 57 L 11.5 57 C 8.5 57 6 54.5 6 51.5 Z" fill="url(#flapGrad)" stroke="#93A3B8" stroke-width="1"/>
  <!-- Specular highlight line along upper lip -->
  <path d="M 7.5 25 C 7.5 23 9 21.5 11 21.5 L 24 21.5 C 26 21.5 28 23 29.5 24.8 L 32 27.8 C 33.5 29.5 35.8 30.5 38.5 30.5 L 53 30.5 C 55 30.5 56.5 31.8 56.5 33.5" stroke="url(#specularGrad)" stroke-width="1.2" stroke-linecap="round"/>
</g>
<!-- Apps grid emblem -->
<rect x="23" y="33" width="7" height="7" rx="2" fill="#0079A8"/>
<rect x="34" y="33" width="7" height="7" rx="2" fill="#2E3440"/>
<rect x="23" y="43" width="7" height="7" rx="2" fill="#2E3440"/>
<rect x="34" y="43" width="7" height="7" rx="2" fill="#4C719C"/>
</svg>